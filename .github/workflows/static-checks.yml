# Checks that read the code without building it: types, ESLint and Prettier. Runs on every pull request.
# The job is named "static-checks" so the ruleset can require it before a PR merges into main.
name: Static Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: static-checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            web/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix api
          npm ci --prefix web

      - name: Typecheck
        run: |
          npm run typecheck --prefix api
          npm run typecheck --prefix web

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check
