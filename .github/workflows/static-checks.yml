# Checks that read the code without building it: types, ESLint (with Prettier's formatting as a rule), and shellcheck for the
# scripts in bin/ and lib/. Runs on every pull request,
# and on main so code scanning has a baseline to compare pull requests against.
# The job is named "static-checks" so the ruleset can require it before a PR merges into main.
# TypeScript, ESLint (formatting included) and shellcheck results go to GitHub code scanning as SARIF
# (docs/ci.md#sarif), which shows them on the pull request's changed lines.
name: Static Checks

on:
  pull_request:
  merge_group: # each pull request in the merge queue, on its merge with main
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write # upload SARIF to code scanning

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: static-checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            web/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix api
          npm ci --prefix web

      # The SARIF steps keep going on errors so every report gets uploaded; the last step fails the job.
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run -s typecheck:sarif

      - name: ESLint and Prettier
        id: eslint
        continue-on-error: true
        # On errors, run it again with the readable formatter so the log shows them too.
        run: npm run -s lint:sarif || { npm run -s lint; exit 1; }

      # shellcheck comes with the runner image; settings are in .shellcheckrc.
      - name: Shellcheck
        id: shellcheck
        continue-on-error: true
        run: |
          shellcheck --version
          npm run -s shellcheck:sarif

      - name: Upload TypeScript results
        if: ${{ !cancelled() && hashFiles('typecheck.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: typecheck.sarif
          category: typescript

      - name: Upload ESLint results
        if: ${{ !cancelled() && hashFiles('eslint.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint.sarif
          category: eslint

      - name: Upload shellcheck results
        if: ${{ !cancelled() && hashFiles('shellcheck.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: shellcheck.sarif
          category: shellcheck

      - name: Result
        env:
          TYPECHECK: ${{ steps.typecheck.outcome }}
          ESLINT: ${{ steps.eslint.outcome }}
          SHELLCHECK: ${{ steps.shellcheck.outcome }}
        run: |
          echo "Typecheck: $TYPECHECK, ESLint and Prettier: $ESLINT, shellcheck: $SHELLCHECK"
          [ "$TYPECHECK" = success ] && [ "$ESLINT" = success ] && [ "$SHELLCHECK" = success ]
