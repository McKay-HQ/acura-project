# Every pull request into main needs exactly one version label, which decides the next release's bump
# (docs/ci.md#versions): breaking -> major, feature -> minor, fix -> patch, sync -> no bump.
# The job is named "version-label" so the ruleset can require it. Adding or removing a label re-runs it.
# Run from the Actions tab on a branch, it checks that branch's open pull request.
name: Version label

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  merge_group: # the merge queue needs every required check to report on its merge commit too
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  version-label:
    name: version-label
    runs-on: ubuntu-24.04
    steps:
      - name: Check the label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # The pull request's labels as they are now, not as the triggering event saw them: the run for "opened" can
          # start before the label lands, and a re-run replays its event.
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
              # The queue's branch is gh-readonly-queue/main/pr-<number>-<sha>: check that pull request.
              PR_NUMBER=$(sed -nE 's#.*/pr-([0-9]+)-[0-9a-f]+$#\1#p' <<< "$QUEUE_REF")
              [ -n "$PR_NUMBER" ] || { echo "::error::Couldn't tell which pull request $QUEUE_REF is for"; exit 1; }
          fi
          if [ -n "$PR_NUMBER" ]; then
              labels=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.labels[].name') \
                  || { echo "::error::Couldn't read the labels of pull request #$PR_NUMBER"; exit 1; }
          else
              prs=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:$BRANCH") \
                  || { echo "::error::Couldn't look up the pull request for $BRANCH"; exit 1; }
              if [ "$(jq length <<< "$prs")" = 0 ]; then
                  echo "::error::$BRANCH has no open pull request to check"
                  exit 1
              fi
              labels=$(jq -r '.[0].labels[].name' <<< "$prs")
          fi
          found=$(grep -xE 'breaking|feature|fix|sync' <<< "$labels" || true)
          case $(grep -c . <<< "$found") in
              1) echo "Version label: $found" ;;
              0) echo "::error::Add one label: breaking (major), feature (minor), fix (patch) or sync (no bump)"; exit 1 ;;
              *) echo "::error::Only one version label, please (found: $(tr '\n' ' ' <<< "$found"))"; exit 1 ;;
          esac
