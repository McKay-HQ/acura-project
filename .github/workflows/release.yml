# Tag a commit with the next semantic version and publish a GitHub release for it, with notes
# generated from the commits since the previous version. The first release is v1.0.0; after that
# each release bumps the patch number unless asked for a minor or major bump.
# Runs on its own from the Actions tab (tags the branch tip), or as the last step of Deploy (tags
# the commit that was deployed).
name: Release

on:
    workflow_dispatch:
        inputs:
            bump:
                description: Which part of the version to raise
                type: choice
                options: [patch, minor, major]
                default: patch
    workflow_call:
        inputs:
            sha:
                description: Commit to tag
                type: string
                required: true
            image-tag:
                description: Tag of the deployed images, listed in the notes
                type: string
                required: false
            bump:
                description: patch, minor or major
                type: string
                required: false
                default: patch
        outputs:
            version:
                description: The release's tag, e.g. v1.2.3
                value: ${{ jobs.release.outputs.version }}

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-24.04
        outputs:
            version: ${{ steps.tag.outputs.version }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # all tags, for numbering and the notes

            - name: Pick the version
              id: tag
              env:
                  SHA: ${{ inputs.sha || github.sha }}
                  BUMP: ${{ inputs.bump || 'patch' }}
              run: |
                  # Latest vMAJOR.MINOR.PATCH tag (other tags, like the old dated ones, are ignored).
                  last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
                  if [ -z "$last" ]; then
                      version=v1.0.0
                  else
                      IFS=. read -r major minor patch <<< "${last#v}"
                      case $BUMP in
                          major) version="v$((major + 1)).0.0" ;;
                          minor) version="v$major.$((minor + 1)).0" ;;
                          patch) version="v$major.$minor.$((patch + 1))" ;;
                          *) echo "::error::bump must be patch, minor or major (got $BUMP)"; exit 1 ;;
                      esac
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "previous=$last" >> "$GITHUB_OUTPUT"
                  echo "sha=$SHA" >> "$GITHUB_OUTPUT"
                  echo "Releasing $SHA as $version (previous: ${last:-none})"

            - name: Tag and publish
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.tag.outputs.version }}
                  SHA: ${{ steps.tag.outputs.sha }}
                  IMAGE_TAG: ${{ inputs.image-tag }}
                  PREVIOUS: ${{ steps.tag.outputs.previous }}
              run: |
                  notes=""
                  if [ -n "$IMAGE_TAG" ]; then
                      notes=$(printf 'Deployed images:\n- `acuraproject.azurecr.io/acura-api:%s`\n- `acuraproject.azurecr.io/acura-web:%s`\n' "$IMAGE_TAG" "$IMAGE_TAG")
                  fi
                  since=()
                  [ -n "$PREVIOUS" ] && since=(--notes-start-tag "$PREVIOUS")
                  gh release create "$VERSION" --target "$SHA" --title "$VERSION" --generate-notes "${since[@]}" --notes "$notes"
