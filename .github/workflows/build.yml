# Build both images and push them to the registry, tagged with the commit (bin/build).
# Runs on its own from the Actions tab, or as part of Deploy.
name: Build

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      image-tag:
        description: The tag the images were pushed with (the commit)
        value: ${{ jobs.build.outputs.image-tag }}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: production
    outputs:
      image-tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/azure
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: ./bin/build -P
