<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#eef0f2" />
        <title>RSX Type-S Project</title>
        <link rel="icon" href="/favicon.png" type="image/png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <script>
            // Light by default; dark only if this browser picked it with the header toggle.
            (function () {
                var t = 'light';
                try {
                    if (localStorage.getItem('rsxTheme') === 'dark') t = 'dark';
                } catch (e) {}
                document.documentElement.dataset.theme = t;
                if (t === 'dark') document.querySelector('meta[name="theme-color"]').content = '#14181d';
            })();
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
        />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
