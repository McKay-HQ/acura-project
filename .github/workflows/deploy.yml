# On every push to main (see docs/ci.md):
#   - Code changed: Build -> roll out the new images -> Sync -> Release.
#   - Only other files changed (e.g. the catalog in api/seed/): Sync.
# Run it from the Actions tab to deploy without a push; Build, Sync and Release also run on their own.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Build, deploy and release even if no code changed
        type: boolean
        default: true
      bump:
        description: Release version bump (auto reads the merged pull requests' labels, as pushes do)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# One deploy at a time; a newer push waits for the current run instead of cancelling it mid-rollout.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write # Sync opens a pull request for what it pulls from the app
  actions: write # and starts the checks on it
  # pull-requests: write also lets Release read the merged pull requests' labels
  id-token: write

jobs:
  # Code changed since the last release, i.e. the last commit Deploy rolled out, not just in this push: a push
  # waiting for the running deploy is cancelled when another one arrives, and a rollout can fail, so the code of an
  # earlier push may not have gone out yet.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version tags and the commits since the last one
      - name: Did code change?
        id: diff
        run: |
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)
          if [ -z "$last" ]; then
              echo "No release yet, so deploying."
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          code=$(git diff --name-only "$last" HEAD -- \
              api/src api/migrations api/scripts api/docker ':(glob)api/*.json' web docker-compose.yml \
              bin/build bin/deploy bin/deploy.d lib .github/workflows .github/actions)
          if [ -n "$code" ]; then
              echo "Code changed since $last:"
              sed 's/^/  /' <<< "$code"
              echo "code=true" >> "$GITHUB_OUTPUT"
          else
              echo "No code changed since $last."
              echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/build.yml

  rollout:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/azure
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Rolls out the images Build just pushed and waits until the new revision answers.
      - name: Roll out
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: ./bin/deploy -P -S

  # After a rollout, or on its own when no code changed.
  sync:
    needs: [changes, rollout]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/sync.yml

  release:
    needs: [build, rollout, sync]
    if: ${{ !cancelled() && needs.rollout.result == 'success' }}
    uses: ./.github/workflows/release.yml
    with:
      sha: ${{ github.sha }}
      image-tag: ${{ needs.build.outputs.image-tag }}
      bump: ${{ inputs.bump || 'auto' }}
