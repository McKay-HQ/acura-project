# Tag a commit with the next semantic version and publish a GitHub release for it, with notes
# generated from the commits since the previous version. The first release is v1.0.0. After that the
# bump comes from the labels on the pull requests merged since the previous version (docs/ci.md#versions):
#   breaking -> major,  feature -> minor,  fix (or no label) -> patch,  sync -> nothing. The biggest
#   one wins; when every pull request is a sync, there's no new release.
# Runs on its own from the Actions tab (tags the branch tip), or as the last step of Deploy (tags
# the commit that was deployed).
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise (auto reads the merged pull requests' labels)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
  workflow_call:
    inputs:
      sha:
        description: Commit to tag
        type: string
        required: true
      image-tag:
        description: Tag of the deployed images, listed in the notes
        type: string
        required: false
      bump:
        description: auto, patch, minor or major
        type: string
        required: false
        default: auto
    outputs:
      version:
        description: The release's tag, e.g. v1.2.3
        value: ${{ jobs.release.outputs.version }}

permissions:
  contents: write
  pull-requests: read # labels of the merged pull requests

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags, for numbering and the notes

      - name: Pick the version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha || github.sha }}
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          # A failed label lookup must stop the release, not quietly leave it at a patch bump.
          set -o pipefail
          # Latest vMAJOR.MINOR.PATCH tag (other tags, like the old dated ones, are ignored).
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)
          if [ -n "$last" ] && [ "$BUMP" = auto ]; then
              # The pull requests that brought in the commits since the last version, with their labels.
              prs=$(git log --format=%H "$last..$SHA" | while read -r commit; do
                  gh api "repos/$GITHUB_REPOSITORY/commits/$commit/pulls" \
                      --jq '.[] | select(.merged_at != null) | "#\(.number) \([.labels[].name] | join(","))"' \
                      || { echo "::error::Couldn't look up the pull request for $commit" >&2; exit 1; }
              done | sort -u)
              labels=$(cut -d' ' -f2- <<< "$prs" | tr ',' '\n')
              # Catalog syncs don't count toward the bump.
              counted=$(grep -vE '^#[0-9]+ (.*,)?sync(,|$)' <<< "$prs" || true)
              if grep -qx breaking <<< "$labels"; then BUMP=major
              elif grep -qx feature <<< "$labels"; then BUMP=minor
              elif [ -n "$prs" ] && [ -z "$counted" ]; then BUMP=none
              else BUMP=patch; fi
              echo "Pull requests since $last:"
              sed 's/^/  /' <<< "${prs:-none}"
              echo "-> $BUMP"
          fi
          if [ "$BUMP" = none ]; then
              echo "Only catalog syncs since $last, so no new release."
              echo "version=" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          if [ -z "$last" ]; then
              version=v1.0.0
          else
              IFS=. read -r major minor patch <<< "${last#v}"
              case $BUMP in
                  major) version="v$((major + 1)).0.0" ;;
                  minor) version="v$major.$((minor + 1)).0" ;;
                  patch) version="v$major.$minor.$((patch + 1))" ;;
                  *) echo "::error::bump must be patch, minor or major (got $BUMP)"; exit 1 ;;
              esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$last" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Releasing $SHA as $version (previous: ${last:-none})"

      - name: Tag and publish
        if: steps.tag.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
          SHA: ${{ steps.tag.outputs.sha }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          PREVIOUS: ${{ steps.tag.outputs.previous }}
        run: |
          notes=""
          if [ -n "$IMAGE_TAG" ]; then
              notes=$(printf 'Deployed images:\n- `acuraproject.azurecr.io/acura-api:%s`\n- `acuraproject.azurecr.io/acura-web:%s`\n' "$IMAGE_TAG" "$IMAGE_TAG")
          fi
          since=()
          [ -n "$PREVIOUS" ] && since=(--notes-start-tag "$PREVIOUS")
          gh release create "$VERSION" --target "$SHA" --title "$VERSION" --generate-notes "${since[@]}" --notes "$notes"
