# On every push to main (see docs/ci.md):
#   - Code changed: Build -> roll out the new images -> Sync -> Release.
#   - Only other files changed (e.g. the catalog in api/seed/): Sync.
# Run it from the Actions tab to deploy without a push; Build, Sync and Release also run on their own.
name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            deploy:
                description: Build, deploy and release even if no code changed
                type: boolean
                default: true

# One deploy at a time; a newer push waits for the current run instead of cancelling it mid-rollout.
concurrency:
    group: deploy
    cancel-in-progress: false

permissions:
    contents: write
    id-token: write

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            code: ${{ steps.filter.outputs.code == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
        steps:
            - uses: actions/checkout@v4
            - uses: dorny/paths-filter@v3
              id: filter
              with:
                  filters: |
                      code:
                        - 'api/src/**'
                        - 'api/migrations/**'
                        - 'api/scripts/**'
                        - 'api/docker/**'
                        - 'api/*.json'
                        - 'web/**'
                        - 'docker-compose.yml'
                        - 'bin/build'
                        - 'bin/deploy'
                        - 'bin/deploy.d/**'
                        - 'lib/**'
                        - '.github/workflows/**'
                        - '.github/actions/**'

    build:
        needs: changes
        if: needs.changes.outputs.code == 'true'
        uses: ./.github/workflows/build.yml

    rollout:
        needs: build
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/azure
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            # Rolls out the images Build just pushed and waits until the new revision answers.
            - name: Roll out
              env:
                  IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
              run: ./bin/deploy -P -S

    # After a rollout, or on its own when no code changed.
    sync:
        needs: [changes, rollout]
        if: ${{ !cancelled() && !failure() }}
        uses: ./.github/workflows/sync.yml

    release:
        needs: [build, rollout, sync]
        if: ${{ !cancelled() && needs.rollout.result == 'success' }}
        uses: ./.github/workflows/release.yml
        with:
            sha: ${{ github.sha }}
            image-tag: ${{ needs.build.outputs.image-tag }}
